name: CI/CD - TechStore API a AWS ECS Fargate

# Actividad 4.1: se activa ante push a la rama main
on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1                      # Region del Learner Lab (ajustar si es distinta)
  ECR_REPOSITORY: techstore-api              # Nombre del repositorio creado en Amazon ECR
  ECS_CLUSTER: techstore-cluster             # Nombre del Cluster ECS
  ECS_SERVICE: techstore-api-service         # Nombre del Servicio ECS Fargate
  ECS_TASK_DEFINITION_FAMILY: techstore-api  # Familia de la Task Definition
  CONTAINER_NAME: techstore-api              # Nombre del contenedor dentro de la Task Definition

jobs:
  build-test-deploy:
    name: Build, Test y Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Actividad 4.2, paso 1: compilar y testear con Maven
      - name: Compilar y ejecutar tests (Maven)
        run: mvn -B clean test

      - name: Empaquetar JAR
        run: mvn -B package -DskipTests

      # Actividad 4.2, paso 2: credenciales temporales de AWS Academy
      # (Secrets del repositorio: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN)
      - name: Configurar credenciales de AWS (temporales - AWS Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Actividad 4.2, paso 3: construir la imagen Docker (Dockerfile multi-stage) y subirla a ECR
      - name: Build y push de la imagen Docker a Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Actividad 4.2, paso 4: actualizar el servicio ECS Fargate con la nueva imagen
      - name: Descargar la Task Definition actual
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --query taskDefinition > task-definition.json

      - name: Insertar nueva imagen en la Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Desplegar la nueva Task Definition en el Servicio ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
