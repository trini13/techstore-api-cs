# Configuracion exclusiva para pruebas (mvn test en GitHub Actions).
# Este archivo pisa al de src/main/resources/application.properties cuando
# se ejecutan los tests, para que el ApplicationContext no necesite un
# Postgres real corriendo en el runner de CI/CD.

# Base de datos en memoria (H2), simulando dialecto Postgres
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

server.port=8080

# Valores dummy para que el contexto cargue sin credenciales reales de AWS
aws.region=us-east-1
aws.sqs.audit-queue-url=https://sqs.us-east-1.amazonaws.com/000000000000/test-queue
